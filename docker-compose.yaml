---
services:
  carnivuth-site:
    build:
      dockerfile: ./Dockerfile
      target: serve
    ports:
      - 1313:1313
    develop:
      watch:
        - path: ./Dockerfile
          action: rebuild
        - path: ./hugo.yaml
          action: rebuild
        - path: ./content/
          action: sync
          target: /site/content/
        - path: ./layouts/
          action: sync
          target: /site/layouts/
        - path: ./assets/
          action: sync
          target: /site/assets/
        - path: ./static/
          action: sync
          target: /site/static/
        - path: ./archetypes/
          action: sync
          target: /site/archetypes/

