---
name: Publish blog changes on github pages
on:
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - ".obsidian"
      - "readme.md"
      - "to_import"
      - "docker-compose.yaml"

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:

      - name: checkout repository
        uses: actions/checkout@v4
      - name: Check for pages without title
        run: test "$(make -s missing_title )" == ""

      - name: Check for pages without description
        run: test "$(make -s missing_description )" == ""

  build:
    needs: check
    runs-on: ubuntu-22.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push {{ github.ref_name }} tag
        uses: docker/build-push-action@v7
        with:
          push: false
          target: deploy
          outputs: 'type=local,dest=.'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
